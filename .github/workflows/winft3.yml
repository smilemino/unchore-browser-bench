name: winft3
on: workflow_dispatch
jobs:
  fresh:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install r107
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release download 155.0.8059.85-r107 -R smilemino/unchore-browser-releases -p '*-setup.exe' -O setup107.exe
          $p = Start-Process .\setup107.exe -ArgumentList '--do-not-launch-chrome' -Wait -PassThru
          "SETUP107_RC=$($p.ExitCode)"
          $A = Join-Path $env:LOCALAPPDATA 'Unchore Browser\Application'
          "EXE=$(Join-Path $A 'chrome.exe')" | Out-File -Append $env:GITHUB_ENV
          "EXTDIR=$(Join-Path $A '155.0.8059.107\Extensions\unchore-assistant')" | Out-File -Append $env:GITHUB_ENV
      - name: A debug tag A (version 0.4.0), default profile, exe
        shell: pwsh
        working-directory: winft
        run: |
          (Get-Content firsttab-debug2.js -Raw).Replace("'|ok=' + ok", "'|tag=A|ok=' + ok") | Set-Content "$env:EXTDIR\firsttab.js" -NoNewline
          node ft3.js A 3 exe
      - name: B tag B, same version 0.4.0 (like .106 to .107)
        shell: pwsh
        working-directory: winft
        run: |
          (Get-Content firsttab-debug2.js -Raw).Replace("'|ok=' + ok", "'|tag=B|ok=' + ok") | Set-Content "$env:EXTDIR\firsttab.js" -NoNewline
          node ft3.js B 3 exe
      - name: C tag C, version bumped 0.4.1
        shell: pwsh
        working-directory: winft
        run: |
          (Get-Content firsttab-debug2.js -Raw).Replace("'|ok=' + ok", "'|tag=C|ok=' + ok") | Set-Content "$env:EXTDIR\firsttab.js" -NoNewline
          $m = "$env:EXTDIR\manifest.json"; (Get-Content $m -Raw).Replace('"version": "0.4.0"', '"version": "0.4.1"') | Set-Content $m -NoNewline
          node ft3.js C 3 exe
          node ft3.js Clnk 2 lnk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-fresh, path: "winft/shots/*.png" }
  upgrade:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install r106 then use it
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release download 155.0.8059.85-r106 -R smilemino/unchore-browser-releases -p '*-setup.exe' -O setup106.exe
          gh release download 155.0.8059.85-r107 -R smilemino/unchore-browser-releases -p '*-setup.exe' -O setup107.exe
          $p = Start-Process .\setup106.exe -ArgumentList '--do-not-launch-chrome' -Wait -PassThru
          "SETUP106_RC=$($p.ExitCode)"
          $A = Join-Path $env:LOCALAPPDATA 'Unchore Browser\Application'
          "EXE=$(Join-Path $A 'chrome.exe')" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem $A | ForEach-Object { "APPDIR $($_.Name)" }
      - name: U0 r106 default profile
        shell: pwsh
        working-directory: winft
        run: node ft3.js U0 2 exe
      - name: Upgrade to r107 (real file, untouched) and use it
        shell: pwsh
        working-directory: winft
        run: |
          $p = Start-Process ..\setup107.exe -ArgumentList '--do-not-launch-chrome' -Wait -PassThru
          "SETUP107_RC=$($p.ExitCode)"
          $A = Join-Path $env:LOCALAPPDATA 'Unchore Browser\Application'
          Get-ChildItem $A | ForEach-Object { "APPDIR $($_.Name)" }
          node ft3.js U1 2 exe
      - name: U2 r107 with tag U2 debug (same version 0.4.0)
        shell: pwsh
        working-directory: winft
        run: |
          $ext = Join-Path $env:LOCALAPPDATA 'Unchore Browser\Application\155.0.8059.107\Extensions\unchore-assistant'
          (Get-Content firsttab-debug2.js -Raw).Replace("'|ok=' + ok", "'|tag=U2|ok=' + ok") | Set-Content "$ext\firsttab.js" -NoNewline
          node ft3.js U2 3 exe
      - name: U3 version bumped 0.4.1
        shell: pwsh
        working-directory: winft
        run: |
          $ext = Join-Path $env:LOCALAPPDATA 'Unchore Browser\Application\155.0.8059.107\Extensions\unchore-assistant'
          (Get-Content firsttab-debug2.js -Raw).Replace("'|ok=' + ok", "'|tag=U3|ok=' + ok") | Set-Content "$ext\firsttab.js" -NoNewline
          $m = "$ext\manifest.json"; (Get-Content $m -Raw).Replace('"version": "0.4.0"', '"version": "0.4.1"') | Set-Content $m -NoNewline
          node ft3.js U3 3 exe
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-upgrade, path: "winft/shots/*.png" }
